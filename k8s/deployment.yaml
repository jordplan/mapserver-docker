apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mapserver
  template:
    metadata:
      labels:
        app: mapserver
    spec:
      containers:
        - image: europe-north1-docker.pkg.dev/cloudmark2/main/mapserver:latest

          imagePullPolicy: Always
          name: mapserver
          ports:
            - containerPort: 80
          volumeMounts:
            - name: ortho
              mountPath: /srv/ortho
      volumes:
        - name: ortho
          persistentVolumeClaim:
            claimName: ortho
